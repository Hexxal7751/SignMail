name: signmail
description: A mobile-first email client with first-class S/MIME signing.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  enough_mail: ^2.1.7
  flutter_secure_storage: ^10.3.4
  file_picker: ^10.3.7
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
