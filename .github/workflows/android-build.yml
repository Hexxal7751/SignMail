
name: SignMail Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org net.hexxal.signmail .
          rm -f test/widget_test.dart

      - name: Apply SignMail Android setup (icons, permissions, desugaring)
        run: python3 tools/patch_android.py

      - name: Restore persistent debug keystore
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: signmail-debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          KEYSTORE="$HOME/.config/.android/debug.keystore"

          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -f "$KEYSTORE" ]; then
            echo "No cached debug keystore found. Generating one."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reusing the cached debug keystore."
          fi

      - name: Show Android OAuth setup details
        run: |
          echo "=== Android application ID ==="
          grep -h 'applicationId' \
            android/app/build.gradle \
            android/app/build.gradle.kts 2>/dev/null || true

          echo ""
          echo "=== Debug SHA-1 fingerprint ==="

          keytool -list -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey |
            grep -E 'SHA1:|SHA-1:'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SignMail-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7