name: SignMail Desktop Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Generate Linux project files
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --org net.hexxal.signmail .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package
        run: tar -czf SignMail-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux build
        uses: actions/upload-artifact@v6
        with:
          name: SignMail-linux-x64
          path: SignMail-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project files
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org net.hexxal.signmail .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SignMail-windows-x64.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: SignMail-windows-x64
          path: SignMail-windows-x64.zip
          if-no-files-found: error
          retention-days: 7